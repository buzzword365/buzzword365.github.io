name: Website checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and verify 3D engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run check
          git diff --exit-code -- assets/sculpture.bundle.js
      - name: Validate navigation, assets and privacy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.links=[]; self.assets=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if 'id' in data:
                      assert data['id'] not in self.ids, data['id']
                      self.ids.add(data['id'])
                  if tag=='a': self.links.append(data.get('href',''))
                  if tag in ('script','img') and data.get('src','').startswith('./'):
                      self.assets.append(data['src'])
          doc=Path('index.html').read_text()
          p=Page();p.feed(doc)
          for asset in p.assets:
              assert Path(asset).exists(), asset
          for project in ('weather-eyes','sonora-music','spoof-by-ziz','class-notes'):
              assert any(project in link for link in p.links),project
          for marker in ('sculpture-canvas','sculpture-spin','sculpture-save','sculpture-reset','site-menu','project-dialog','theme-toggle','motion-toggle'):
              assert marker in p.ids, marker
          for name in ('index.html','style.css','script.js','boot.js','sculpture.source.js','README.md','privacy.html'):
              content=Path(name).read_text().lower()
              for sensitive in ('/users/','/home/','@gmail.com','gpslatitude','home_coordinates'):
                  assert sensitive not in content, (name,sensitive)
          assert Path('assets/THREE-LICENSE.txt').exists()
          assert 'privacy.html' in doc
          assert 'Content-Security-Policy' in doc
          assert '<script>' not in doc
          assert 'boot.js' in doc and Path('boot.js').exists()
          assert 'fonts.googleapis.com' not in Path('style.css').read_text()
          assert 'fonts.gstatic.com' not in Path('style.css').read_text()
          assert '®' not in doc and '©' not in doc
          css=Path('style.css').read_text()
          assert css.count('{')==css.count('}')
          print('HTML, CSS, links, images and privacy checks passed.')
          PY
