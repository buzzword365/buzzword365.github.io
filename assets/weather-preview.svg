<svg xmlns="http://www.w3.org/2000/svg" width="740" height="460" viewBox="0 0 740 460" role="img" aria-label="Weather Eyes: a curious, black-eyed character under a glowing green, rainy sky">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".96" y2="1"><stop stop-color="#111a18"/><stop offset=".51" stop-color="#182720"/><stop offset="1" stop-color="#101917"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#baff76" stop-opacity=".35"/><stop offset=".42" stop-color="#a7f675" stop-opacity=".13"/><stop offset="1" stop-color="#a7f675" stop-opacity="0"/></radialGradient>
    <radialGradient id="face" cx=".33" cy=".26" r=".88"><stop stop-color="#222b24"/><stop offset=".33" stop-color="#0c110f"/><stop offset=".74" stop-color="#050907"/><stop offset="1" stop-color="#020504"/></radialGradient>
    <radialGradient id="eye" cx=".35" cy=".28" r=".86"><stop stop-color="#f1ffe3"/><stop offset=".76" stop-color="#d8f5cb"/><stop offset="1" stop-color="#b3dfab"/></radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bfff8e" stop-opacity=".44"/><stop offset=".6" stop-color="#729d79" stop-opacity=".25"/><stop offset="1" stop-color="#345441" stop-opacity=".04"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" stroke="#afc3af" stroke-width="1" fill="none" opacity=".13"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="frame"><rect width="740" height="460" rx="16"/></clipPath>
    <style>
      .weather-copy{font-family:Arial,Helvetica,sans-serif}
      .drop{animation:fall 2.7s linear infinite}
      .drop.d2{animation-delay:-1.15s}
      .drop.d3{animation-delay:-2.1s}
      .pupil{animation:look 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .spark{animation:glimmer 4s ease-in-out infinite}
      @keyframes fall{from{transform:translate(0,-90px);opacity:0}20%{opacity:.8}80%{opacity:.8}to{transform:translate(-38px,100px);opacity:0}}
      @keyframes look{0%,10%,100%{transform:translate(0,0)}30%,42%{transform:translate(6px,-3px)}66%,78%{transform:translate(-5px,2px)}}
      @keyframes glimmer{0%,100%{opacity:.3}50%{opacity:.9}}
      @media(prefers-reduced-motion:reduce){.drop,.pupil,.spark{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="740" height="460" fill="url(#bg)"/>
    <rect width="740" height="460" fill="url(#grid)"/>
    <circle cx="465" cy="215" r="250" fill="url(#glow)"/>
    <ellipse cx="530" cy="355" rx="250" ry="75" fill="#a3fe82" opacity=".09" filter="url(#blur)"/>

    <!-- Atmospheric contour lines: a weather-chart counterpart to Spoof's route grid -->
    <g fill="none" stroke="#bdfd92" stroke-width="1.3" opacity=".27">
      <path d="M-90 353C55 266 101 385 215 299S397 230 490 269 642 340 824 165"/>
      <path d="M-84 369C74 281 102 401 226 315S398 246 503 285 656 354 828 183"/>
      <path d="M-79 386C76 300 114 419 237 333S409 265 522 305 665 369 837 204"/>
      <path d="M-65 408C89 327 133 439 252 351S430 288 541 326 695 384 844 237"/>
      <path d="M-51 431C109 353 150 467 270 372S463 305 564 347 704 397 851 261"/>
    </g>

    <!-- Glowing rim + radar-like circles behind the head -->
    <g transform="translate(471 226)" fill="none">
      <circle r="176" stroke="#c7ff8f" stroke-width="1.4" opacity=".27"/>
      <circle r="196" stroke="#c7ff8f" stroke-width="1.1" stroke-dasharray="3 12" opacity=".46"/>
      <circle r="219" stroke="#c7ff8f" stroke-width=".8" opacity=".14"/>
      <path d="M-138-108A175 175 0 0 1 25-174" stroke="#caff85" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <path d="M128 120A175 175 0 0 1 16 174" stroke="#caff85" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <path d="M0-209v18M0 191v18M-209 0h18M191 0h18" stroke="#caff85" opacity=".6"/>
    </g>

    <!-- Stylized neon-green storm bank -->
    <path d="M263 118c27-53 89-62 139-30 13-35 42-56 82-55 50 0 77 28 87 57 64-23 119 9 139 58H269Z" fill="url(#cloud)" opacity=".72"/>
    <path d="M261 145c36-22 76-34 128-24 46-48 94-53 150-18 41-28 100-20 149 20" fill="none" stroke="#bbff94" stroke-opacity=".22" stroke-width="2"/>
    <path d="M540 93l-24 48h23l-21 52 67-70h-29l22-30z" fill="#bfff81" opacity=".18"/>

    <!-- Weather streaks, consistently angled and small to keep the type legible -->
    <g stroke="#c9ff9a" stroke-width="2.4" stroke-linecap="round" opacity=".45">
      <path class="drop" d="M304 158l-15 32M366 89l-18 38M627 113l-13 29M683 199l-14 29M259 281l-13 29M691 347l-15 35"/>
      <path class="drop d2" d="M322 249l-13 27M397 161l-14 30M588 273l-15 33M661 289l-14 30M720 95l-15 31"/>
      <path class="drop d3" d="M282 203l-11 24M460 85l-12 27M637 224l-12 30M709 292l-14 30M379 361l-11 25"/>
    </g>

    <!-- Original illustrative Weather Eyes mascot, shaded from dark charcoal -->
    <ellipse cx="484" cy="409" rx="142" ry="20" fill="#020705" opacity=".62" filter="url(#shadow)"/>
    <circle cx="471" cy="225" r="145" fill="#caff85" opacity=".18" filter="url(#blur)"/>
    <circle cx="468" cy="223" r="145" fill="url(#face)" stroke="#5c815e" stroke-opacity=".63" stroke-width="2"/>
    <ellipse cx="432" cy="148" rx="49" ry="17" transform="rotate(-26 432 148)" fill="#a9ff92" opacity=".055"/>
    <ellipse cx="422" cy="236" rx="58" ry="75" transform="rotate(6 422 236)" fill="url(#eye)"/>
    <ellipse cx="525" cy="231" rx="48" ry="73" transform="rotate(-6 525 231)" fill="url(#eye)"/>
    <ellipse cx="438" cy="250" rx="12" ry="16" fill="#0b100c" class="pupil"/>
    <ellipse cx="541" cy="244" rx="10" ry="14" fill="#0b100c" class="pupil"/>
    <path d="M372 177C404 117 458 96 505 106" stroke="#caff85" stroke-opacity=".08" stroke-width="4" fill="none"/>

    <!-- Label/chips echoing the Spoof by Ziz artwork -->
    <rect x="35" y="33" width="284" height="90" rx="17" fill="#111815" stroke="#617568" stroke-width="1.2"/>
    <circle cx="61" cy="61" r="5" fill="#caff85"/>
    <text class="weather-copy" x="77" y="66" fill="#caff85" font-size="18" font-weight="800" letter-spacing="2.7">WEATHER / EYES</text>
    <text class="weather-copy" x="57" y="94" fill="#ecf5e8" font-size="14.5" font-weight="500">A living macOS wallpaper</text>
    <g class="spark" stroke="#caff85" stroke-width="2.2" stroke-linecap="round">
      <path d="M352 48v18M343 57h18M666 57v16M658 65h16"/>
    </g>

    <g transform="translate(37 382)">
      <rect width="222" height="47" rx="12" fill="#111915" stroke="#5b7264"/>
      <path d="M22 26c-8 0-12-5-12-10 0-5 4-9 9-9 2-8 11-10 16-5 6 0 10 5 10 11" fill="none" stroke="#caff85" stroke-width="2" transform="translate(5 9) scale(.66)"/>
      <path d="M23 30l-4 7M36 30l-4 7" stroke="#caff85" stroke-width="2" stroke-linecap="round"/>
      <text class="weather-copy" x="60" y="21" fill="#caff85" font-size="11" font-weight="800" letter-spacing="1.4">REAL WEATHER</text>
      <text class="weather-copy" x="60" y="35" fill="#d7e7d7" font-size="10" letter-spacing=".55">CURSOR-REACTIVE EYES</text>
    </g>
    <rect x="563" y="377" width="143" height="54" rx="13" fill="#caff85"/>
    <text class="weather-copy" x="585" y="409" fill="#142014" font-size="16" font-weight="800" letter-spacing=".3">EXPLORE</text>
    <path d="M680 412l11-11m-9 0h9v9" fill="none" stroke="#142014" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>